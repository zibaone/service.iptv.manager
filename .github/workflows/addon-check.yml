name: Kodi
on:
  # Run action when pushed to master, or for commits in a pull request.
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  kodi-addon-checker:
    name: Addon checker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Omega is the Kodi 21 branch. Kodi 22 (Piers) exposes the same Python 3
        # API, so the check runs against Omega until the checker supports Piers.
        kodi-version: [ omega ]
    steps:
      - name: Check out ${{ github.sha }} from repository ${{ github.repository }}
        uses: actions/checkout@v4

      - name: Run kodi-addon-checker
        uses: xbmc/action-kodi-addon-checker@v1.2
        with:
          kodi-version: ${{ matrix.kodi-version }}
          addon-id: ${{ github.event.repository.name }}
