name: Kodi
on:
  # Run action when pushed to master, or for commits in a pull request.
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  kodi-addon-checker:
    name: Addon checker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Kodi 21 (Omega) and Kodi 22 (Piers) are the two targets of the fork.
        # The checker keys off the branch name in the official add-on repo.
        kodi-version: [ omega, piers ]
    steps:
      - name: Check out ${{ github.sha }} from repository ${{ github.repository }}
        uses: actions/checkout@v4

      - name: Run kodi-addon-checker
        uses: xbmc/action-kodi-addon-checker@v1.2
        with:
          kodi-version: ${{ matrix.kodi-version }}
          addon-id: ${{ github.event.repository.name }}
