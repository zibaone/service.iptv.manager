name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    name: Release service.iptv.manager
    if: startsWith(github.ref, 'refs/tags/')  # prevent from running if it's not a tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build zip file
        id: build
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          make build release=1
          echo "filename=$(cd .. && ls service.iptv.manager-*.zip | head -1)" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        run: |
          sed '1,6d;/^## /,$d' CHANGELOG.md > release-notes.md

      - name: Create release and upload the zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "../${{ steps.build.outputs.filename }}"
